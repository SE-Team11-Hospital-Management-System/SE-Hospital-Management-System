# TASK-04 / HMS-NF-007: build and test every push and every pull request on Linux (two compiler versions) and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Build + unit tests (Linux, g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  ubuntu-22-04:
    # HMS-NF-007: the same source builds and passes the tests with g++ 11 on Ubuntu 22.04
    name: Build + unit tests (Ubuntu 22.04, g++ 11)
    runs-on: ubuntu-22.04
    env:
      CXX: g++-11
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  windows:
    # Same tool-chain the team uses on Windows (MSYS2 UCRT64 g++), see docs/SETUP.md
    name: Build + unit tests (Windows, MSYS2 g++)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  memory-safety:
    # HMS-NF-009 / HMS-SEC-005: run the tests under AddressSanitizer + LeakSanitizer + UBSan
    name: Tests with AddressSanitizer
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1      # HMS-NF-009: any leak or memory error fails the run
    steps:
      - uses: actions/checkout@v4
      - name: Configure (sanitizers on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHMS_SANITIZE=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  quality:
    # HMS-NF-008: no function over 50 lines, no static-analysis warnings, service-layer line coverage >= 70%
    name: Quality (function length, cppcheck, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck gcovr
      - name: Function length (max 50 lines)
        run: python3 tools/check_function_length.py src tests
      - name: Static analysis (cppcheck)
        run: cppcheck --enable=warning,portability --std=c++17 --language=c++ --error-exitcode=1 --inline-suppr --quiet -I src src
      - name: Build with coverage counters
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHMS_COVERAGE=ON && cmake --build build -j 4
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Service-layer line coverage (must be 70% or more)
        run: gcovr -r . --filter 'src/services/' --fail-under-line 70 --print-summary build

  website:
    # HMS-F-070..074: the website must type-check, pass its page tests and build
    name: Website (type check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Type check (TypeScript strict)
        run: npm run typecheck
      - name: Page tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build
